name: ci
on:
  push:
  pull_request:
    # labeled/unlabeled: adding or removing no-doc-change runs the check again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the tag each one was is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18
      - run: bun test
      # The specification (docs/FLOWS.md, docs/RULES.md) and the tests agree, and coverage has not fallen.
      - run: bun run trace
      # The docs are the source of truth: a pull request that changes behaviour (server.ts, public/, scripts/) must
      # change docs/, README.md or SECURITY.md too, unless it carries the label no-doc-change.
      - name: docs change with the code
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_DOC_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-doc-change') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(server\.ts|public/|scripts/)' || true)
          docs=$(echo "$changed" | grep -E '^(docs/|README\.md$|SECURITY\.md$)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            if [ "$NO_DOC_CHANGE" = "true" ]; then echo "code changed without docs; allowed by the no-doc-change label"; exit 0; fi
            echo "::error::server.ts, public/ or scripts/ changed but nothing under docs/, README.md or SECURITY.md did. Update the spec, or add the label no-doc-change."
            exit 1
          fi
